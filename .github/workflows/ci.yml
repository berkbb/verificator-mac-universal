name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test & Build Universal Bundle
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint localization tables and Info.plist
        run: |
          plutil -lint \
            Resources/tr.lproj/Localizable.strings \
            Resources/en.lproj/Localizable.strings \
            Resources/ro.lproj/Localizable.strings \
            Resources/tr.lproj/InfoPlist.strings \
            Resources/en.lproj/InfoPlist.strings \
            Resources/ro.lproj/InfoPlist.strings \
            Support/Info.plist

      - name: Run Swift test suite
        run: swift test

      - name: Build universal Verificator.app + verificator-cli
        run: ./Scripts/build_app.sh release --universal

      - name: Verify bundle integrity & architectures
        env:
          VERIFY_UNIVERSAL: "1"
        run: ./Scripts/verify_bundle.sh

      - name: CLI smoke check
        run: |
          ./build/Verificator.app/Contents/MacOS/verificator-cli --version
          if [ -d /Applications/Safari.app ]; then
            ./build/Verificator.app/Contents/MacOS/verificator-cli --json /Applications/Safari.app >/dev/null
          fi
